<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Sign In</title>
</head>
<body>
    <div class="logo-section">
        <img src="images/Bread Logo.svg" alt="Bread Logo" class="logo">
        <p id="logo-subtext">Bread</p>
    </div>
    <div class="login-card">
            <div class="tab-button">
                <button class="login-tab">Login</button>
                <button class="register-tab">Register</button>
            </div>
            <form>
                <label for="email">Email</label>
                    <input type="email" placeholder="Email input" id="email">
                <label for="password">Password</label>
                    <input type="password" placeholder="Password input" id="password">
            <div class="option-row">
                <div class="remember-group">
                        <input type="checkbox" id="checkbox">
                <label for="checkbox" id="checkbox-label">Remember me</label>
            </div>    
                        <a href="#" id="forgot-password-link">Forgot your password?</a>
            </div>
                <button id="login-button" type="submit" >Login</button>
                <p id="dont-have-account">Don't have an account? <a href="#" id="sign-up-text">Sign up</a></p>
            </form>
    </div>
</body>
</html>
