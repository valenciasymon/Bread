<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="register.css">
        <title>Signup</title>
    </head>
    <body>
        <div class="logo-section">
            <img src="Bread Logo.svg" alt="Bread Logo" class="logo">
            <p id="logo-subtext">Bread</p>
        </div>

        <div class="login-card">
            <div class="tab-button">
                <button class="login-tab">Login</button>
                <button class="register-tab">Register</button>
            </div>
                <form>
                    <label for="username">Username</label>
                        <input type="username" placeholder="username input" id="username">
                    <label for="email">Email</label>
                        <input type="email" placeholder="Email input" id="email">
                    <label for="password">Password</label>
                        <input type="password" placeholder="Password input" id="password">
                    <label for="confirm-password">Confirm password</label>
                        <input type="password" placeholder="Password input" id="confirm-password">
                            <button id="signup-button" type="submit" >Sign up</button>
                </form>
        </div>

    </body>

</html>
