<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="../CSS/profile.css">
    <link rel="stylesheet" href="../CSS/global.css">
</head>

<body>

    <nav>
        <div class="top-nav">
            <div class="content">
                <img src="../assets/bread-logo.svg" alt="Logo" class="logo">
                <p>Bread</p>
            </div>
            <img src="../assets/profilebread.png" alt="Profile Picture" class="profile-pic">
        </div>
    </nav>

    <div class="dashboard-layout">
        <nav>
            <div class="side-nav">
                <ul>
                    <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
                    <li><a href="../history/history.html">History</a></li>
                    <li><a href="../add expense/addExpense.html">Add Expense</a></li>
                    <li><a href="../analytics/analytics.html">Analytics</a></li>
                    <li><a href="#" class="active">Profile</a></li>
                </ul>
            </div>
        </nav>

        <div class="main-content">
            <div class="profile-container">

                <div class="profile-avatar">
                    <span>P</span>
                </div>

                <h1>Juan Dela Cruz</h1>
                <p class="profile-subtitle">Manage your account settings</p>

                <div class="settings-list">

                    <a href="#" class="setting-card">
                        <div class="setting-left">
                            <div class="icon-box">
                                <img src="../assets/Iconprofile.svg" alt="Username Icon" width="20" height="20">
                            </div>

                            <div class="setting-info">
                                <h3>Username</h3>
                                <p>Update your display name</p>
                            </div>
                        </div>

                        <div class="arrow">
                            <img src="../assets/Iconarrow-right.svg" alt="Arrow Icon" width="20" height="20">
                        </div>
                    </a>

                    <a href="#" class="setting-card">
                        <div class="setting-left">
                            <div class="icon-box">
                                <img src="../assets/Iconemail.svg" alt="Email Icon" width="20" height="20">
                            </div>

                            <div class="setting-info">
                                <h3>Email</h3>
                                <p>Manage the email linked to your account</p>
                            </div>
                        </div>

                        <div class="arrow">
                            <img src="../assets/Iconarrow-right.svg" alt="Arrow Icon" width="20" height="20">
                        </div>
                    </a>

                    <a href="#" class="setting-card">
                        <div class="setting-left">
                            <div class="icon-box">
                                <img src="../assets/Iconlock.svg" alt="Password Icon" width="20" height="20">
                            </div>

                            <div class="setting-info">
                                <h3>Change Password</h3>
                                <p>Update your account security</p>
                            </div>
                        </div>

                        <div class="arrow">
                            <img src="../assets/Iconarrow-right.svg" alt="Arrow Icon" width="20" height="20">
                        </div>
                    </a>

                </div>

                <button class="logout-btn">
                    <img src="../assets/Iconlogout.svg" alt="Logout Icon" width="20" height="20">
                    Logout
                </button>

            </div>
        </div>

    </div>
</body>

</html>
